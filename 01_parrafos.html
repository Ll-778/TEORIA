<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Párrafos y Encabezados</title>
</head>
<body>
  <!--Títulos o Encabezados:
  Se tiene 6 tipos de encabezados, desde el h1 hasta el h6. -->
  <!--(h$*6) Crea 6 titulos en orden del 1 al 6 Emmet-->
  <h1>Titulo</h1>
  <!-- El h1 se utiliza una sola vez por pagina esto es debido a que el h1 tiene una importancia en el CEO lo que es el posicionamiento web, es decir, google le da mucha importancia al h1 -->
  <h2>subtitulo</h2>
  <h3>subtitulo</h3>
  <h4>subtitulo</h4>
  <h5>subtitulo</h5>
  <h6>subtitulo</h6>
  <!-- Desde el h2 hasta el h6, se puede utilizar las veces que sean necesarias según el contenido que se quiera recrear. -->

  <!--Párrafo: Los párrafos deben tener una idea o punto especifico.
  Cada párrafo escrito debe de contener un concepto, una idea. Es decir, puede describir una seccion o un elemento, hasta un mensaje en el chat. Por ejemplo en una seccion se habla sobre los beneficios del ejercicio:
  Un párrafo puede tratar de mejorar la salud cardiovascular y otro puede ser sobre los beneficios y cuidados de la salud mental. Finalmente. debe existir un motivo para que exista un párrafo. -->
  <p>
    Lorem, ipsum dolor sit amet consectetur adipisicing elit. Harum ut debitis natus maiores nisi quae magni, doloremque nesciunt! Consequuntur necessitatibus illum voluptates cupiditate delectus vero laudantium, nam molestiae quam rerum!
  </p>
<!-- (CTRL+SHIFT+P) o (ALT+Z) Ajusta el contenido del párrafo a la ventana del editor -->
<!-- Existen algunas tecnologias de asistencia como lectores de pantalla, que ayudan a las personas con discapacidad visual  a navegar por el sitio web. 
Por ejemplo: cuando estas tecnologias leen el h1 de la pagina, entienden de que trata de la pagina por el h1. Por temas de accesibilidad web es importante que se utilice solo un hg1 por pagina. -->
</body>
</html>
